<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  <title>The programmer's diary</title>
</head>
<body>
  <header class="header">
    <img src="{{ url_for('static', filename='img/logo.svg') }}" alt="logo" width="30" height="30">
    <ul class="main-list">
    </ul>
  </header>
  <main class="main__login">
    {% block content %}
    <form action="{{ url_for('login') }}" method="POST" class="login">
      {% if error %}
        <p class="error">{{ error }}</p>
      {% endif %}
      
      <label for="email">
        <input class="form__input" type="email" name="email" id="email" placeholder="Ingrese su Correo" required>
      </label>
      
      <label for="password">
        <input class="form__input" type="password" name="password" id="password" placeholder="Ingrese su Contraseña" required>
      </label>
      
      <button class="form__button" type="submit">Login</button>
      <a href="{{ url_for('reg') }}" class="form__button reg__link">Register</a>
    </form>
    {% endblock %}
  </main>
  <footer>
  </footer>
</body>
</html>
