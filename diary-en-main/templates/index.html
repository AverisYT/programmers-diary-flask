<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  <title>The programmer's diary</title>
</head>
<body>
  <header class="header">
    <img src="{{ url_for('static', filename='img/logo.svg') }}" alt="logo" width="30" height="30">
    <ul class="main-list">
      <li class="list__item">
        <a href="{{ url_for('logout') }}">
          <img src="{{ url_for('static', filename='img/login.svg') }}" alt="logout" width="20" height="20">
        </a>
      </li>
    </ul>
  </header>

  <main>
    {% block content %}
    <h1 class="main__title">My entries</h1>

    <div class="weather-widget-container">
      <iframe 
        src="https://wttr.in/Santiago?format=3" 
        width="100%" 
        height="100%" 
        frameborder="0" 
        scrolling="no">
      </iframe>
    </div>

    <ul class="cards-list">
      {% for el in cards %}
      <li class="card">
        <a class="card__link" href="{{ url_for('card', id=el.id) }}">
          <img class="card__img" src="{{ url_for('static', filename='img/post_icon.png') }}" width="250" height="250" alt="post_icon">
          <div class="card__text">
            <h2 class="card__title">{{ el.title }}</h2>
            <p class="card__subtitle">{{ el.subtitle }}</p>
          </div>
        </a>
      </li>
      {% endfor %}
      <li class="card card--creat">
        <a class="creat__link" href="{{ url_for('create') }}"></a>
      </li>
    </ul>
    {% endblock %}
  </main>

  <footer>
  </footer>
</body>
</html>
